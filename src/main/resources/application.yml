spring:
  application:
    name: conversation-compiler
  datasource:
    url: jdbc:sqlite:${CONVERSATION_COMPILER_DB:./data/conversation-compiler.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
  ai:
    mcp:
      client:
        enabled: ${CONVERSATION_COMPILER_MCP_ENABLED:false}
        type: SYNC
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            llmwiking:
              url: ${LLMWIKING_MCP_URL:}
              endpoint: ${LLMWIKING_MCP_ENDPOINT:}

server:
  port: 8080

agent-trace:
  # Leave empty for local development. Set AGENT_TRACE_AUTH_KEY in network deployments.
  auth-key: ${AGENT_TRACE_AUTH_KEY:}

conversation-compiler:
  security:
    secret-key: ${CONVERSATION_COMPILER_SECRET_KEY:}
  agent:
    enabled: ${CONVERSATION_COMPILER_AGENT_ENABLED:false}
  mcp:
    auth-enabled: ${CONVERSATION_COMPILER_MCP_AUTH_ENABLED:false}
  compiler:
    enabled: ${CONVERSATION_COMPILER_COMPILER_ENABLED:false}
    scan-interval-seconds: ${CONVERSATION_COMPILER_SCAN_INTERVAL_SECONDS:60}
    max-concurrent-runs: ${CONVERSATION_COMPILER_MAX_CONCURRENT_RUNS:1}
    max-turns-per-run: ${CONVERSATION_COMPILER_MAX_TURNS_PER_RUN:20}
    max-chars-per-run: ${CONVERSATION_COMPILER_MAX_CHARS_PER_RUN:200000}
    task-timeout-seconds: ${CONVERSATION_COMPILER_TASK_TIMEOUT_SECONDS:600}
